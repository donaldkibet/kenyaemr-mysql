name: Nightly Build and Publish

on:
  schedule:
    # Run daily at 00:00 UTC (midnight)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install gdown
        run: pip install gdown

      - name: Download SQL dump from Google Drive
        run: |
          # Download the file from Google Drive
          gdown ${{ secrets.GOOGLE_DRIVE_FILE_URL }} \
            --output init-scripts/dump-database.sql.gz \
            --fuzzy
          
          # Verify file was downloaded
          if [ -f "init-scripts/dump-database.sql.gz" ]; then
            echo "SQL dump downloaded successfully"
            ls -lh init-scripts/dump-database.sql.gz
          else
            echo "ERROR: Failed to download SQL dump"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: dkibet/kenyaemr-mysql
          tags: |
            type=raw,value=8.0-nightly
            type=raw,value=8.0-nightly-{{date 'YYYYMMDD'}}
            type=sha,prefix=8.0-{{date 'YYYYMMDD'}}-

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=dkibet/kenyaemr-mysql:buildcache-8.0
          cache-to: type=inline
          platforms: linux/amd64,linux/arm64
